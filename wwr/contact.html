<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Cougar White Water Rafting</title>
    <meta name="description"
      content="The Contact Us page for the Cougar White Water Rafting company.">
    <meta name="author" content="Jordan Kerr">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/cougar-wwr.jpg" alt="Cougar White Water Rafting" class="logo">
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <h1>Cougar White Water Rafting</h1>
        <div class="contact-info">
            <p></p>
            <p></p>
            <p>123 Main River Street</p>
            <p>Jackson Hole, Wyoming</p>
            <p>+1 999-999-9999</p>
            <p>info@cougarwwr.com</p>
        </div>
        <section class="map-contact">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d37279.648471612614!2d-110.74470972268058!3d43.60981418931306!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x53530fe335ea3d45%3A0x3252c9dbaac6965a!2sJackson%20Hole!5e0!3m2!1sen!2sus!4v1770006472608!5m2!1sen!2sus"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <div class="contact">
                <form action="#" method="get">
                    <div class="form-item">
                        <label>Full Name:<input type="text" id="contact1" name="contact1"
                              required></label>
                    </div>
                    <div class="form-item">
                        <label>Email:<input type="email" id="contact2" name="contact2"
                              required></label>
                    </div>
                    <fieldset class="form-purpose">
                        <legend>Message Purpose</legend>

                        <label>
                            <input type="radio" id="purpose1" name="purpose"
                              value="purpose-general">
                            General Inquiry
                        </label>

                        <label>
                            <input type="radio" id="purpose2" name="purpose"
                              value="purpose-reservation">
                            Reservation Question
                        </label>

                        <label>
                            <input type="radio" id="purpose3" name="purpose"
                              value="purpose-website">
                            Website Suggestion
                        </label>
                    </fieldset>
                    <fieldset class="form-item">
                        <legend>Message</legend>
                        <div class="form-item">
                            <label for="inquiry-message">
                                <textarea name="inquiry-message" id="inquiry-message" rows="4"
                                  placeholder="Type Here..."></textarea>
                            </label>
                        </div>
                    </fieldset>
                    <div>
                        <input type="checkbox" id="subscribe" name="subscribe">
                        <label for="subscribe">Please Subscribe me to Monthly Newsletter</label>

                    </div>
                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </section>
        <section class="serve-you">
            <h2>We Are Here to Serve You!</h2>
            <figure>
                <img src="images/profile.jpg" alt="Employee Jordan Kerr">
                <figcaption>Jordan Kerr</figcaption>
            </figure>

            <figure>
                <img src="images/profile2.jpg" alt="Big Mallard rapids">
                <figcaption>Jack Reacher</figcaption>
            </figure>

            <figure>
                <img src="images/profile3.jpg" alt="Half Day Adventure">
                <figcaption>James T Kirk</figcaption>
            </figure>
        </section>
    </main>
    <footer class="footer">
        <p>©️ 2026 - Cougar White Water Rafting - Jordan Kerr</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
