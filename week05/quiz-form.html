<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Week 05 Code Along</title>
    <link rel="stylesheet" href="styles/quiz-form.css">
</head>

<body>
    <main class="box">
        <h1>✅ Basic HTML and CSS Quiz</h1>
        <form action="">
            <div class="quiz-item box">
                <label>1. What does the acronym CSS stand for?
                    <input type="text" id="q1" name="q1" required></label>
            </div>
            <div class="quiz-item box">
                <label>2. How are id and class attributes selected in css?
                    <textarea id="q2" name="q2" required></textarea></label>
            </div>
            <div class="quiz-item box">
                <label>3. Which of the following is a valid CSS comment?
                    <select id="q3" name="q3">
                        <option value="" selected disabled>Choose One...</option>
                        <option value="a">&lt;!-- This is a comment --&gt;</option>
                        <option value="b">/* This is a comment */</option>
                        <option value="c">// This is a comment</option>
                    </select></label>
            </div>
            <div class="quiz-item box">
                <label>4. What is the bottom margin given this declaration?
                    <code class="box">margin: 10px 5px 15px;</code>
                    <input type="number" id="q4" name="q4"></label>
            </div>
            <div class="quiz-button">
                <button type="submit">Submit Quiz for Grading</button>
            </div>
        </form>
    </main>

</body>

</html>
